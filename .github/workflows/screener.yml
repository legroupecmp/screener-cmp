name: Mise à jour du screener

on:
  schedule:
    # 21h30 UTC, lundi au vendredi = après la clôture US (16h ET) été comme hiver
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python screener.py
      - name: Sauvegarde des résultats dans le dépôt
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/index.html state.json
          git diff --cached --quiet || git commit -m "Screener $(date -u +%F)"
          git push
      # Publication de la page directement (ne dépend pas d'un déclencheur automatique de GitHub Pages)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
