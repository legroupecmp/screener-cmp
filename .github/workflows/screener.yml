name: Mise à jour du screener

on:
  schedule:
    # 21h30 UTC, lundi au vendredi = après la clôture US (16h ET) été comme hiver
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python screener.py
      - name: Commit les résultats
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/index.html state.json
          git diff --cached --quiet || git commit -m "Screener $(date -u +%F)"
          git push
